<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Siswa Modern</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
      overflow:hidden;
      position:relative;
    }

    /* Background Blur Circle */
    body::before,
    body::after{
      content:'';
      position:absolute;
      width:300px;
      height:300px;
      border-radius:50%;
      filter:blur(80px);
      opacity:.5;
    }

    body::before{
      background:#00f2fe;
      top:-100px;
      left:-100px;
    }

    body::after{
      background:#7c3aed;
      bottom:-100px;
      right:-100px;
    }

    .login-container{
      width:380px;
      padding:40px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(15px);
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
      color:white;
      position:relative;
      z-index:2;
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .login-container h2{
      text-align:center;
      font-size:32px;
      margin-bottom:10px;
      font-weight:600;
    }

    .login-container p{
      text-align:center;
      font-size:14px;
      color:#d1d5db;
      margin-bottom:30px;
    }

    .input-box{
      position:relative;
      margin-bottom:25px;
    }

    .input-box input{
      width:100%;
      padding:15px 20px;
      border:none;
      outline:none;
      border-radius:14px;
      background:rgba(255,255,255,0.12);
      color:white;
      font-size:15px;
      transition:0.3s;
      border:1px solid transparent;
    }

    .input-box input::placeholder{
      color:#d1d5db;
    }

    .input-box input:focus{
      border:1px solid #38bdf8;
      background:rgba(255,255,255,0.18);
      box-shadow:0 0 15px rgba(56,189,248,0.5);
    }

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      font-size:13px;
    }

    .options a{
      color:#7dd3fc;
      text-decoration:none;
    }

    .options a:hover{
      text-decoration:underline;
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#06b6d4,#3b82f6);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 20px rgba(59,130,246,0.5);
    }

    .bottom-text{
      text-align:center;
      margin-top:20px;
      font-size:13px;
      color:#d1d5db;
    }

    .bottom-text a{
      color:#7dd3fc;
      text-decoration:none;
      font-weight:500;
    }

    .bottom-text a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login Siswa</h2>
    <p>Silakan masuk ke akun siswa</p>

    <form>
      <div class="input-box">
        <input type="text" placeholder="Masukkan NIS">
      </div>

      <div class="input-box">
        <input type="password" placeholder="Masukkan Password">
      </div>

      <div class="options">
        <label>
          <input type="checkbox">
          Ingat saya
        </label>

        <a href="#">Lupa password?</a>
      </div>

      <button type="submit" class="login-btn">
        Masuk
      </button>
    </form>

    <div class="bottom-text">
      Belum punya akun? <a href="#">Daftar</a>
    </div>
  </div>

</body>
</html>
